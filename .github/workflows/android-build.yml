name: Build Android APK (with extra actions)

on:
  workflow_dispaname: Build Android APK (with extra actions)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch export script (include random/ events/ actions)
        run: |
          F=scripts/export_android_assets.py
          python3 - "$F" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = 'CORE_GROUPS = frozenset(("idle", "move", "turn", "click", "drag"))'
          new = 'CORE_GROUPS = frozenset(("idle", "move", "turn", "click", "drag", "random", "events"))'
          assert old in s, "CORE_GROUPS line not found"
          p.write_text(s.replace(old, new), encoding="utf-8")
          print("patched export script")
          PY

      - name: Patch PetEngine (add SHOW mode for random actions)
        run: |
          F=android/app/src/main/java/io/github/dshpet/mobile/PetEngine.kt
          python3 - "$F" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s = s.replace(
            "enum class PetMode { IDLE, TURN, MOVE, CLICK, DRAG, THROWN }",
            "enum class PetMode { IDLE, TURN, MOVE, CLICK, DRAG, THROWN, SHOW }")
          s = s.replace(
            "    private var pendingMove: ClipSpec? = null",
            "    private var pendingMove: ClipSpec? = null\n"
            "    private val showClips: List<ClipSpec> = groups[\"random\"].orEmpty()\n"
            "    private var showCooldown = 12.0\n"
            "    private var idleElapsed = 0.0\n"
            "    var showEverySeconds = 25.0\n"
            "    var showChance = 0.75")
          s = s.replace(
            "    fun click() { vx = 0.0;",
            "    fun playShow(): Boolean {\n"
            "        if (showClips.isEmpty() || paused) return false\n"
            "        vx = 0.0; vy = 0.0; pendingMove = null\n"
            "        enter(PetMode.SHOW, showClips.random(random))\n"
            "        showCooldown = showEverySeconds\n"
            "        idleElapsed = 0.0\n"
            "        return true\n"
            "    }\n\n"
            "    fun click() { vx = 0.0;")
          s = s.replace(
            "        elapsed += dt\n        when (mode) {",
            "        elapsed += dt\n        if (mode == PetMode.IDLE) idleElapsed += dt\n        when (mode) {")
          s = s.replace(
            "            PetMode.IDLE -> if (elapsed >= clip.duration) {",
            "            PetMode.SHOW -> { if (elapsed >= clip.duration) idle() }\n"
            "            PetMode.IDLE -> if (elapsed >= clip.duration) {\n"
            "                if (showClips.isNotEmpty() && idleElapsed >= showCooldown && random.nextDouble() < showChance) { playShow(); return }")
          p.write_text(s, encoding="utf-8")
          print("patched PetEngine")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install asset export deps (incl PySide6 for pet core)
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.3" "imageio-ffmpeg>=0.6"
          # pet/frameseq_provision.py 依赖 PySide6 做 WebM 解帧（Linux 上限 6.11，
          # 见 requirements.txt 的引用计数问题注释）
          pip install "PySide6>=6.5,<6.12"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PpetPython=python3

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
