name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.3" "imageio-ffmpeg>=0.6" "PySide6>=6.5,<6.12"
          python -c "from PySide6.QtCore import QLockFile; print('PySide6 OK')"

      - name: Show what we are building
        run: |
          echo '--- CORE_GROUPS ---'
          grep -n 'CORE_GROUPS = ' scripts/export_android_assets.py
          echo '--- SHOW mode ---'
          grep -n 'SHOW' android/app/src/main/java/io/github/dshpet/mobile/PetEngine.kt | head -3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PpetPython=python3

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
