name: Build Android APK (with extra actions)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.3" "imageio-ffmpeg>=0.6"
          pip install "PySide6>=6.5,<6.12"
          python -c "from PySide6.QtCore import QLockFile; print('PySide6 OK')"

      - name: Patch export script
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('scripts/export_android_assets.py')
          s = p.read_text(encoding='utf-8')
          old = 'CORE_GROUPS = frozenset(("idle", "move", "turn", "click", "drag"))'
          new = 'CORE_GROUPS = frozenset(("idle", "move", "turn", "click", "drag", "random", "events"))'
          if old not in s:
              print('ERROR: CORE_GROUPS not found')
              [print(i, l) for i, l in enumerate(s.splitlines()) if 'CORE_GROUPS' in l]
              raise SystemExit(1)
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('OK export patched')
          PY

      - name: Patch PetEngine
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/java/io/github/dshpet/mobile/PetEngine.kt')
          s = p.read_text(encoding='utf-8')
          pairs = [
            ('enum class PetMode { IDLE, TURN, MOVE, CLICK, DRAG, THROWN }',
             'enum class PetMode { IDLE, TURN, MOVE, CLICK, DRAG, THROWN, SHOW }',
             'enum'),
            ('    private var pendingMove: ClipSpec? = null',
             '    private var pendingMove: ClipSpec? = null\n    private val showClips: List<ClipSpec> = groups["random"].orEmpty()\n    private var showCooldown = 12.0\n    private var idleElapsed = 0.0\n    var showEverySeconds = 25.0\n    var showChance = 0.75',
             'fields'),
            ('    fun click() { vx = 0.0;',
             '    fun playShow(): Boolean {\n        if (showClips.isEmpty() || paused) return false\n        vx = 0.0; vy = 0.0; pendingMove = null\n        enter(PetMode.SHOW, showClips.random(random))\n        showCooldown = showEverySeconds\n        idleElapsed = 0.0\n        return true\n    }\n\n    fun click() { vx = 0.0;',
             'playShow'),
            ('        elapsed += dt\n        when (mode) {',
             '        elapsed += dt\n        if (mode == PetMode.IDLE) idleElapsed += dt\n        when (mode) {',
             'idleElapsed'),
            ('            PetMode.IDLE -> if (elapsed >= clip.duration) {',
             '            PetMode.SHOW -> { if (elapsed >= clip.duration) idle() }' + '\n' + '            PetMode.IDLE -> if (elapsed >= clip.duration) {' + '\n' + '                if (showClips.isNotEmpty() && idleElapsed >= showCooldown && random.nextDouble() < showChance) { playShow(); return }',
             'showBranch'),
          ]
          for a, b, tag in pairs:
              if a not in s:
                  print('ERROR: missing', tag)
                  raise SystemExit(1)
              s = s.replace(a, b, 1)
              print('done', tag)
          p.write_text(s, encoding='utf-8')
          print('OK PetEngine patched')
          PY

      - name: Verify patches
        run: |
          grep -n 'CORE_GROUPS = ' scripts/export_android_assets.py
          grep -n 'SHOW' android/app/src/main/java/io/github/dshpet/mobile/PetEngine.kt | head -5

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PpetPython=python3 --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
